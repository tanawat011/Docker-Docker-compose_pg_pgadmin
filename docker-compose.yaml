# PostgreSQL + Adminer + pgAdmin for local development.
# DEV ONLY: passwords come from .env (copy .env.example); never reuse them.
# Every port is bound to 127.0.0.1, so only this machine can reach them.
name: postgres-pgadmin

services:
  db:
    image: postgres:18.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-9601}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      # PostgreSQL 18+ images keep their data under /var/lib/postgresql/18/
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  adminer:
    image: adminer:6.3.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-9602}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6

  pgadmin:
    image: dpage/pgadmin4:9.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-9603}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?copy .env.example to .env}
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # The database above, listed in pgAdmin from the first sign-in.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db_data:
  pgadmin_data:
